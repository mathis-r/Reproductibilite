name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image for C
      run: docker build ./tp1et2/c --file tp1et2/c/Dockerfile --tag lab2-c:$(date +%s)
    - name: Build the Docker image for Python
      run: docker build ./tp1et2/python --file tp1et2/python/Dockerfile --tag lab2-python:$(date +%s)
