name: Build and publish lab answers

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  python-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Python image
        working-directory: tp1et2/python
        run: docker build -t lab2-python:${{ github.sha }} .

      - name: Create output directory
        run: mkdir -p tp1et2/python/out

      - name: Run Python container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/tp1et2/python/out:/app/out" \
            lab2-python:${{ github.sha }}

      - name: Check Python outputs
        run: |
          ls -l tp1et2/python/out
          test -f tp1et2/python/out/answer_associativity.txt
          test -f tp1et2/python/out/answer_banking.txt

      - name: Commit and push Python outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A tp1et2/python/out

          if git diff --cached --quiet; then
            echo "No Python changes to commit"
            exit 0
          fi

          git commit -m "Update Python answers [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin HEAD:"${GITHUB_REF_NAME}"

  c-job:
    needs: python-job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build C image
        working-directory: tp1et2/c
        run: docker build -t lab2-c:${{ github.sha }} .

      - name: Create output directory
        run: mkdir -p tp1et2/c/out

      - name: Run C container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/tp1et2/c/out:/app/out" \
            lab2-c:${{ github.sha }}

      - name: Check C outputs
        run: |
          ls -l tp1et2/c/out
          test -f tp1et2/c/out/answer_associativity.txt
          test -f tp1et2/c/out/answer_banking.txt
          test -f tp1et2/c/out/answer_associativity_llm.txt

      - name: Commit and push C outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A tp1et2/c/out

          if git diff --cached --quiet; then
            echo "No C changes to commit"
            exit 0
          fi

          git commit -m "Update C answers [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin HEAD:"${GITHUB_REF_NAME}"
