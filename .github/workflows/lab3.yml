name: Build and run lab 3

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python run.py
